spring:
  application:
    name: api-gateway
  
  # Server configuration
  main:
    web-application-type: reactive
  
  # Valkey/Redis configuration for rate limiting
  # Override these in application-local.yml or with environment variables
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6378}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:changeme}
      timeout: 60000ms
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  
  # Cloud Gateway configuration
  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - X-Correlation-Id
              - X-Response-Time
              - X-Gateway-Version
            maxAge: 3600
      
      # Route definitions
      routes:
        # Weather API routes
        - id: weather-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/weather/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 150
                redis-rate-limiter.requestedTokens: 1
        
        # Valkey API routes
        - id: valkey-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/valkey/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 75
                redis-rate-limiter.requestedTokens: 1
        
        # QR Code API routes
        - id: qrcode-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/qrcode/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 150
                redis-rate-limiter.requestedTokens: 1
        
        # Health check route (public)
        - id: actuator-health
          uri: http://localhost:8081
          predicates:
            - Path=/actuator/health
        
        # Swagger UI route (public)
        - id: swagger-ui
          uri: http://localhost:8081
          predicates:
            - Path=/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**

# Server configuration
server:
  port: 8080

# Management/Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Logging configuration
logging:
  level:
    root: INFO
    com.example.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/gateway.log

# JWT configuration
jwt:
  secret: your-256-bit-secret-key-here-change-this-in-production-environment-for-security
  expiration: 3600000  # 1 hour in milliseconds

# API versioning configuration
api:
  version:
    default: v1
    header-name: X-API-Version
